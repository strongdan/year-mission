name: Cloudflare qualification

on:
  push:
    branches: [infra/cloudflare-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vinext:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: vinext compatibility scan
        continue-on-error: true
        run: pnpx vinext@1.0.0-beta.9 check

      - name: Generate Cloudflare configuration in runner
        run: >-
          pnpx vinext@1.0.0-beta.9 init
          --skip-check
          --platform=cloudflare
          --data-cache=none
          --image-optimization=none

      - name: Build Cloudflare Worker output
        run: pnpm run build:vinext

      - name: Materialize qualified migration files
        if: github.event_name == 'push' && github.ref == 'refs/heads/infra/cloudflare-migration'
        shell: bash
        run: |
          git add .gitignore package.json pnpm-lock.yaml pnpm-workspace.yaml vite.config.ts wrangler.jsonc
          if git diff --cached --quiet; then
            echo 'Cloudflare migration files already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'infra: materialize qualified Cloudflare config'
          git push origin HEAD:infra/cloudflare-migration

      - name: Show generated migration files
        if: always()
        shell: bash
        run: |
          echo '--- git status ---'
          git status --short
          echo '--- package.json ---'
          cat package.json
          echo '--- vite.config.ts ---'
          test -f vite.config.ts && cat vite.config.ts || true
          echo '--- wrangler.jsonc ---'
          test -f wrangler.jsonc && cat wrangler.jsonc || true
          echo '--- .gitignore tail ---'
          tail -n 30 .gitignore || true
